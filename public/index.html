<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImmiAssist | AI-Powered Legal Platform</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons: primary CDN with fallback -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
        // Fallback if unpkg fails
        if (typeof lucide === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"><\/script>');
        }
    </script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="app"></div>

    <!-- Auth View -->
    <template id="auth-view">
        <div class="auth-wrapper">
            <div class="auth-card glass" id="portal-selector" style="text-align:center;">
                <div class="auth-header">
                    <div class="auth-logo">
                        <i data-lucide="scale" style="width:32px;height:32px;color:#818cf8"></i>
                    </div>
                    <h1>ImmiAssist</h1>
                    <p>Select your portal to continue</p>
                </div>
                <div style="display:flex; flex-direction:column; gap: 1rem; margin-top: 2rem;">
                    <button class="btn btn-primary" onclick="showPortalLogin('MEMBER')">Member Portal</button>
                    <button class="btn btn-secondary" onclick="showPortalLogin('LEGAL_ASSOCIATE')">Legal Associate Portal</button>
                    <button class="btn btn-secondary" onclick="showPortalLogin('LAWYER')">Lawyer Portal</button>
                </div>
            </div>

            <div class="auth-card glass" id="portal-login" style="display:none;">
                <div class="auth-header">
                    <div class="auth-logo">
                        <i data-lucide="scale" style="width:32px;height:32px;color:#818cf8"></i>
                    </div>
                    <h1 id="portal-title">Portal Login</h1>
                    <p>Enter your credentials to access the system</p>
                </div>

                <div class="auth-mode-toggle" id="member-auth-toggle" style="display:none;">
                    <button class="mode-btn active" id="mode-signin" onclick="switchAuthMode('signin')">Sign In</button>
                    <button class="mode-btn" id="mode-signup" onclick="switchAuthMode('signup')">Create Account</button>
                </div>

                <!-- Sign In -->
                <div id="signin-panel">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="login-email" class="form-control" placeholder="you@example.com" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" class="form-control" placeholder="Enter your password" autocomplete="current-password">
                    </div>
                    <div id="login-error" class="form-error" style="display:none"></div>
                    <button class="btn btn-primary btn-full" id="signin-btn" onclick="login()">
                        Sign In
                    </button>
                    <p class="auth-footer-note">
                        <a href="#" onclick="showPortalSelector()">← Back to Portal Selection</a>
                    </p>
                </div>

                <!-- Create Account -->
                <div id="signup-panel" style="display:none">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="reg-name" class="form-control" placeholder="Full legal name" autocomplete="name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="reg-email" class="form-control" placeholder="you@example.com" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label>Phone Number <span class="label-optional">Optional</span></label>
                        <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 000-0000" autocomplete="tel">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" autocomplete="new-password">
                    </div>
                    <div id="reg-error" class="form-error" style="display:none"></div>
                    <button class="btn btn-primary btn-full" id="register-btn" onclick="register()">
                        Create Account
                    </button>
                    <p class="auth-footer-note">
                        <a href="#" onclick="showPortalSelector()">← Back to Portal Selection</a>
                    </p>
                </div>

            </div>
        </div>
    </template>

    <!-- App Layout (3-Panel) -->
    <template id="app-view">
        <div class="app-layout" id="main-app-layout">
            <!-- Left Sidebar -->
            <aside class="sidebar glass-panel">
                <div class="brand">
                    <i data-lucide="scale"></i> ImmiAssist
                </div>
                
                <nav id="sidebar-nav">
                    <!-- Populated by JS based on role -->
                </nav>

                <div class="user-profile-widget">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold;">
                        <span id="user-initials">U</span>
                    </div>
                    <div style="flex: 1; overflow: hidden">
                        <div style="font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden" id="user-name">User Name</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted)" id="user-role-label">Member</div>
                    </div>
                    <button class="btn-icon" onclick="logout()" title="Logout">
                        <i data-lucide="log-out" style="width: 18px; height: 18px"></i>
                    </button>
                </div>
            </aside>

            <!-- Center Area -->
            <main class="main-area" id="main-area-content">
                
                <!-- Dashboard View -->
                <div id="dashboard-view-container" style="display:none; padding: 2rem; overflow-y:auto; height:100%;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
                        <h2 style="font-size: 1.5rem; font-weight: 700;">Dashboard</h2>
                        <button class="btn btn-primary" onclick="startNewCase()">
                            <i data-lucide="plus" style="width:16px;"></i> New Case
                        </button>
                    </div>
                    <div class="dashboard-grid" id="dashboard-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
                        <!-- Cards injected here -->
                    </div>
                </div>

                <!-- Case View -->
                <div id="case-view-container" style="display:flex; flex-direction:column; height:100%;">
                    <header class="top-header">
                    <div style="display: flex; align-items: center; gap: 1rem">
                        <h2 style="font-size: 1.25rem; font-weight: 600" id="header-title">Active Case</h2>
                        <span style="color: var(--text-muted); font-size: 0.875rem" id="header-case-number"></span>
                    </div>
                    <div class="header-badges" id="header-badges">
                        <!-- Populated dynamically -->
                    </div>
                </header>

                <div class="chat-container" id="chat-messages">
                    <!-- Messages populated here -->
                </div>

                <div class="input-area">
                    <div class="chat-input-wrapper">
                        <button class="btn-icon" onclick="document.getElementById('file-upload').click()" title="Upload Document">
                            <i data-lucide="paperclip" style="width: 20px"></i>
                        </button>
                        <input type="file" id="file-upload" style="display: none" onchange="uploadDocument(event)">
                        
                        <input type="text" id="chat-input" placeholder="Type a message to Jana AI..." onkeypress="handleKeyPress(event)">
                        
                        <button class="btn-icon primary" onclick="sendMessage()">
                            <i data-lucide="send" style="width: 20px"></i>
                        </button>
                    </div>
                </div>
                </div>
            </main>

            <!-- Right Panel (Context & Timeline) -->
            <aside class="context-panel glass-panel" id="right-panel-context">
                <div id="panel-documents">
                    <h3 class="section-title"><i data-lucide="folder"></i> Required Documents</h3>
                    <div style="display: flex; flex-direction: column; gap: 0.75rem" id="docs-list">
                        <!-- Docs populated here -->
                    </div>
                </div>

                <div style="margin-top: 1rem">
                    <h3 class="section-title"><i data-lucide="clock"></i> Case Timeline</h3>
                    <div class="timeline" id="timeline-list">
                        <!-- Timeline events populated here -->
                    </div>
                </div>
            </aside>
        </div>
    </template>

    <script>
        const API = '/api';
        let state = {
            token: localStorage.getItem('token'),
            user: null,
            activeRole: 'MEMBER',
            caseId: null,
            sessionId: null,
            socket: null
        };

        // Safe icon initializer — works even if Lucide CDN failed to load
        function safeCreateIcons() {
            try {
                if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {
                    lucide.createIcons();
                }
            } catch(e) { /* icons optional */ }
        }

        window.onload = () => {
            if (state.token) {
                initApp();
            } else {
                renderAuth();
            }
        };

        function renderAuth() {
            document.getElementById('app').innerHTML = document.getElementById('auth-view').innerHTML;
            safeCreateIcons();
        }

        async function loginAs(email, password) {
            // Quick-access: call API directly, no form fields involved
            const btn = event && event.target ? event.target.closest('.quick-login-btn') : null;
            if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; }
            try {
                const res = await fetch(`${API}/users/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    state.token = data.token;
                    state.user  = data.user;
                    localStorage.setItem('token', data.token);
                    initApp();
                } else {
                    alert('Login failed: ' + (data.message || res.status));
                    if (btn) { btn.disabled = false; btn.style.opacity = ''; }
                }
            } catch(e) {
                alert('Network error. Make sure the server is running.');
                if (btn) { btn.disabled = false; btn.style.opacity = ''; }
            }
        }

        function switchAuthMode(mode) {
            const signinPanel = document.getElementById('signin-panel');
            const signupPanel = document.getElementById('signup-panel');
            const signinBtn   = document.getElementById('mode-signin');
            const signupBtn   = document.getElementById('mode-signup');
            if (mode === 'signin') {
                signinPanel.style.display = '';
                signupPanel.style.display = 'none';
                signinBtn.classList.add('active');
                signupBtn.classList.remove('active');
            } else {
                signinPanel.style.display = 'none';
                signupPanel.style.display = '';
                signinBtn.classList.remove('active');
                signupBtn.classList.add('active');
                // Clear error
                const err = document.getElementById('reg-error');
                if (err) { err.style.display = 'none'; err.textContent = ''; }
            }
            safeCreateIcons();
        }

        function showPortalSelector() {
            document.getElementById('portal-selector').style.display = 'block';
            document.getElementById('portal-login').style.display = 'none';
        }

        function showPortalLogin(role) {
            state.activeRole = role;
            document.getElementById('portal-selector').style.display = 'none';
            document.getElementById('portal-login').style.display = 'block';
            
            const titles = {
                'MEMBER': 'Member Portal',
                'LEGAL_ASSOCIATE': 'Legal Associate Portal',
                'LAWYER': 'Lawyer Portal'
            };
            document.getElementById('portal-title').innerText = titles[role];
            
            const emailMap = {
                'MEMBER': 'member@immiassist.io',
                'LEGAL_ASSOCIATE': 'associate@immiassist.io',
                'LAWYER': 'lawyer@immiassist.io'
            };
            const passMap = {
                'MEMBER': 'member123',
                'LEGAL_ASSOCIATE': 'associate123',
                'LAWYER': 'lawyer123'
            };
            document.getElementById('login-email').value = emailMap[role];
            document.getElementById('login-password').value = passMap[role];

            // Only members can create accounts directly
            const toggle = document.getElementById('member-auth-toggle');
            if (role === 'MEMBER') {
                toggle.style.display = 'flex';
            } else {
                toggle.style.display = 'none';
                switchAuthMode('signin');
            }
        }

        async function register() {
            const name     = document.getElementById('reg-name').value.trim();
            const email    = document.getElementById('reg-email').value.trim();
            const phone    = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const errEl    = document.getElementById('reg-error');

            errEl.style.display = 'none';
            errEl.textContent = '';

            if (!name || !email || !password) {
                errEl.textContent = 'Please fill in name, email, and password.';
                errEl.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errEl.textContent = 'Password must be at least 6 characters.';
                errEl.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${API}/users/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name, email, password, phone: phone || undefined })
                });
                const data = await res.json();
                if (res.ok) {
                    // Auto-login after successful registration
                    const loginRes = await fetch(`${API}/users/login`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email, password })
                    });
                    const loginData = await loginRes.json();
                    if (loginRes.ok) {
                        state.token = loginData.token;
                        state.user  = loginData.user;
                        localStorage.setItem('token', loginData.token);
                        initApp();
                    } else {
                        // Registration ok but login failed — switch to sign in
                        switchAuthMode('signin');
                        document.getElementById('login-email').value = email;
                    }
                } else {
                    errEl.textContent = data.message || 'Registration failed. Please try again.';
                    errEl.style.display = 'block';
                }
            } catch(e) {
                errEl.textContent = 'Network error. Please try again.';
                errEl.style.display = 'block';
            }
        }

        async function login() {
            const email    = (document.getElementById('login-email').value || '').trim();
            const password = document.getElementById('login-password').value || '';
            const errEl    = document.getElementById('login-error');
            if (errEl) { errEl.style.display = 'none'; errEl.textContent = ''; }

            if (!email || !password) {
                if (errEl) { errEl.textContent = 'Please enter email and password.'; errEl.style.display = 'block'; }
                return;
            }
            try {
                const res = await fetch(`${API}/users/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    state.token = data.token;
                    state.user  = data.user;
                    localStorage.setItem('token', data.token);
                    initApp();
                } else {
                    const msg = data.message || 'Invalid email or password.';
                    if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
                    else alert(msg);
                }
            } catch(e) {
                const msg = 'Network error. Make sure the server is running.';
                if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
                else alert(msg);
            }
        }

        function logout() {
            // Wipe ALL state — prevents onboarding data from leaking into next session
            localStorage.removeItem('token');
            state = {
                token: null,
                user: null,
                activeRole: 'MEMBER',
                caseId: null,
                sessionId: null,
                socket: null
            };
            window.casesList = null;
            if (state.socket) state.socket.disconnect();
            if (window.socket) window.socket.disconnect();
            renderAuth();
        }

        async function initApp() {
            document.getElementById('app').innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:1rem">
                    <div style="width:44px;height:44px;border:3px solid var(--primary);border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div>
                    <p style="color:var(--text-muted);font-size:0.9rem">Loading your workspace&hellip;</p>
                </div>
                <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
            `;

            // ── Step 1: Authenticate & load user ─────────────────────────────
            let profileRes;
            try {
                profileRes = await fetch(`${API}/users/profile`, {
                    headers: { 'Authorization': `Bearer ${state.token}` },
                    cache: 'no-store'
                });
            } catch (networkErr) {
                console.error('initApp: network error fetching profile', networkErr);
                document.getElementById('app').innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:1.5rem">
                        <p style="color:#f87171;font-size:0.95rem">Network error. Please check your connection and try again.</p>
                        <button class="btn btn-primary" onclick="logout()">Back to Login</button>
                    </div>
                `;
                return;
            }

            if (!profileRes.ok) {
                // Token invalid or expired — force re-login
                localStorage.removeItem('token');
                state.token = null;
                state.user = null;
                renderAuth();
                return;
            }

            state.user = await profileRes.json();

            // ── Step 2: Onboarding gate (MEMBER only) ────────────────────────
            if (state.user.role === 'MEMBER') {
                let onbRes;
                try {
                    onbRes = await fetch(`${API}/users/onboarding-status`, {
                        headers: { 'Authorization': `Bearer ${state.token}` },
                        cache: 'no-store'
                    });
                } catch (networkErr) {
                    console.error('initApp: network error fetching onboarding status', networkErr);
                    // Fail-safe: block dashboard, show onboarding from start
                    await renderOnboarding('MEMBER_PROFILE');
                    return;
                }

                if (!onbRes.ok) {
                    console.warn('initApp: onboarding-status returned', onbRes.status, '— blocking dashboard');
                    await renderOnboarding('MEMBER_PROFILE');
                    return;
                }

                const onb = await onbRes.json();
                console.log('[initApp] onboarding-status:', JSON.stringify(onb));

                // Explicit field-level checks (not just truthy coercion)
                const profileOk = onb.profileComplete === true;
                const legalProfileOk = onb.legalProfileComplete === true;
                // Require AT LEAST one key document (PASSPORT is mandatory)
                const docsOk = onb.documents && onb.documents.PASSPORT === true;

                if (!profileOk) {
                    console.log('[initApp] member profile incomplete → renderOnboarding(MEMBER_PROFILE)');
                    await renderOnboarding('MEMBER_PROFILE');
                    return;
                }
                if (!legalProfileOk) {
                    console.log('[initApp] legal profile incomplete → renderOnboarding(LEGAL_PROFILE)');
                    await renderOnboarding('LEGAL_PROFILE');
                    return;
                }
                if (!docsOk) {
                    console.log('[initApp] documents incomplete → renderOnboarding(DOCUMENTS)');
                    await renderOnboarding('DOCUMENTS');
                    return;
                }

                console.log('[initApp] all onboarding complete → renderDashboard()');
            }

            // ── Step 3: Dashboard (only reached after all checks pass) ───────
            renderDashboard();
        }

        function renderDashboard() {
            document.getElementById('app').innerHTML = document.getElementById('app-view').innerHTML;
            safeCreateIcons();
            document.getElementById('user-name').innerText = state.user.name || state.user.email;
            document.getElementById('user-initials').innerText = (state.user.name || state.user.email).charAt(0).toUpperCase();
            document.getElementById('user-role-label').innerText = state.user.role.replace(/_/g, ' ');
            setupSidebar();
            loadCases();
            initWebSocket();
        }

        async function renderOnboarding(startPhase) {
            const phase = startPhase || 'MEMBER_PROFILE';
            const steps = [
                { key: 'MEMBER_PROFILE', label: 'Member Profile', icon: 'user' },
                { key: 'LEGAL_PROFILE',  label: 'Legal Profile',  icon: 'briefcase' },
                { key: 'DOCUMENTS',      label: 'Documents',      icon: 'file-text' },
                { key: 'REVIEW',         label: 'Review',         icon: 'check-circle' },
            ];
            const stepIdx = steps.findIndex(s => s.key === phase);

            document.getElementById('app').innerHTML = `
                <div class="onboarding-layout">
                    <!-- Left: stepper + info -->
                    <aside class="onboarding-sidebar glass-panel">
                        <div class="brand" style="margin-bottom:2.5rem">
                            <i data-lucide="scale"></i> ImmiAssist
                        </div>
                        <div class="onb-steps">
                            ${steps.map((s, i) => `
                                <div class="onb-step ${i < stepIdx ? 'done' : i === stepIdx ? 'active' : ''}">
                                    <div class="onb-step-dot">
                                        ${i < stepIdx ? '<i data-lucide="check" style="width:14px"></i>' : (i + 1)}
                                    </div>
                                    <div>
                                        <div class="onb-step-label">${s.label}</div>
                                        <div class="onb-step-desc">${
                                            i === 0 ? 'Basic profile & contact info' :
                                            i === 1 ? 'Visa & immigration history' :
                                            i === 2 ? 'Required document uploads' :
                                            'Final legal team review'
                                        }</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="onb-help-box">
                            <p style="font-size:0.8rem;color:var(--text-muted);line-height:1.6">
                                Jana AI will guide you through this process step by step. All information is encrypted and only accessible to your assigned legal team.
                            </p>
                        </div>
                        <div class="user-profile-widget" style="margin-top:auto">
                            <div style="width:36px;height:36px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">
                                ${(state.user.name || state.user.email).charAt(0).toUpperCase()}
                            </div>
                            <div style="flex:1;min-width:0">
                                <div style="font-size:0.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${state.user.name || state.user.email}</div>
                                <div style="font-size:0.72rem;color:var(--text-muted)">${state.user.role.replace(/_/g,' ')}</div>
                            </div>
                            <button onclick="logout()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;padding:0.25rem" title="Sign out"><i data-lucide="log-out" style="width:16px"></i></button>
                        </div>
                    </aside>

                    <!-- Right: Onboarding Forms -->
                    <main class="onboarding-main" style="overflow-y: auto;">
                        <div class="onb-header">
                            <div>
                                <h2 style="font-size:1.2rem;font-weight:700">Case Intake — ${steps[stepIdx]?.label || 'Setup'}</h2>
                                <p style="font-size:0.82rem;color:var(--text-muted);margin-top:0.2rem">Please provide your details below.</p>
                            </div>
                            <div class="badge primary">Step ${stepIdx + 1} of ${steps.length}</div>
                        </div>

                        ${ phase === 'MEMBER_PROFILE' ? `
                        <div style="padding: 2rem;">
                            <form onsubmit="submitMemberProfile(event)">
                                <div class="form-group">
                                    <label>Passport Number</label>
                                    <input type="text" id="onb-passport" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Nationality</label>
                                    <input type="text" id="onb-nationality" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Country of Residence</label>
                                    <input type="text" id="onb-residence" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Visa Type</label>
                                    <input type="text" id="onb-visa-type" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-primary" id="btn-member-submit">Save & Continue</button>
                            </form>
                        </div>
                        ` : '' }
                        
                        ${ phase === 'LEGAL_PROFILE' ? `
                        <div style="padding: 2rem;">
                            <form onsubmit="submitLegalProfile(event)">
                                <div class="form-group">
                                    <label>Current Visa Status</label>
                                    <input type="text" id="onb-visa-status" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Visa Expiry Date</label>
                                    <input type="date" id="onb-visa-expiry" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Current Employer</label>
                                    <input type="text" id="onb-employer" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>University (if applicable)</label>
                                    <input type="text" id="onb-university" class="form-control">
                                </div>
                                <button type="submit" class="btn btn-primary" id="btn-legal-submit">Save & Continue</button>
                            </form>
                        </div>
                        ` : '' }

                        ${ phase === 'DOCUMENTS' ? `
                        <div style="padding: 2rem;">
                            <p style="margin-bottom: 1rem;">Please upload your required documents to proceed.</p>
                            <div class="form-group" style="padding: 1rem; border: 1px solid var(--border); border-radius: 8px;">
                                <label style="font-weight: 600;">Upload Passport</label>
                                <input type="file" class="form-control" style="margin-top: 0.5rem;" accept=".pdf,.jpg,.jpeg,.png" onchange="uploadOnbDoc('PASSPORT', event)">
                                <div id="status-PASSPORT" style="color:var(--primary); font-size: 0.85rem; margin-top: 0.5rem; font-weight: 500;"></div>
                            </div>
                            <div class="form-group" style="padding: 1rem; border: 1px solid var(--border); border-radius: 8px;">
                                <label style="font-weight: 600;">Upload Visa (Optional)</label>
                                <input type="file" class="form-control" style="margin-top: 0.5rem;" accept=".pdf,.jpg,.jpeg,.png" onchange="uploadOnbDoc('VISA', event)">
                                <div id="status-VISA" style="color:var(--primary); font-size: 0.85rem; margin-top: 0.5rem; font-weight: 500;"></div>
                            </div>
                            <button class="btn btn-primary" style="margin-top: 1rem;" onclick="initApp()">Finish & Go to Dashboard</button>
                        </div>
                        ` : '' }
                    </main>
                </div>
            `;
            safeCreateIcons();
            if (phase === 'DOCUMENTS') {
                ensureCaseCreated();
            }
        }

        async function submitMemberProfile(e) {
            e.preventDefault();
            document.getElementById('btn-member-submit').disabled = true;
            try {
                const payload = {
                    passportNumber: document.getElementById('onb-passport').value,
                    nationality: document.getElementById('onb-nationality').value,
                    countryOfResidence: document.getElementById('onb-residence').value,
                    visaType: document.getElementById('onb-visa-type').value
                };
                const res = await fetch(`${API}/users/profile`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    initApp(); // re-evaluates onboarding status
                } else {
                    alert('Failed to save profile');
                    document.getElementById('btn-member-submit').disabled = false;
                }
            } catch (err) {
                alert('Network error');
                document.getElementById('btn-member-submit').disabled = false;
            }
        }

        async function submitLegalProfile(e) {
            e.preventDefault();
            document.getElementById('btn-legal-submit').disabled = true;
            try {
                const payload = {
                    currentVisaStatus: document.getElementById('onb-visa-status').value,
                    visaExpiry: document.getElementById('onb-visa-expiry').value,
                    currentEmployer: document.getElementById('onb-employer').value,
                    university: document.getElementById('onb-university').value || undefined
                };
                const res = await fetch(`${API}/users/profile`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    initApp(); // re-evaluates onboarding status
                } else {
                    alert('Failed to save legal profile');
                    document.getElementById('btn-legal-submit').disabled = false;
                }
            } catch (err) {
                alert('Network error');
                document.getElementById('btn-legal-submit').disabled = false;
            }
        }

        async function ensureCaseCreated() {
            try {
                let caseObj;
                const casesRes = await fetch(`${API}/cases`, { headers: {'Authorization': `Bearer ${state.token}`} });
                if (casesRes.ok) {
                    const list = await casesRes.json();
                    caseObj = Array.isArray(list) ? list[0] : null;
                }
                if (!caseObj) {
                    const cr = await fetch(`${API}/cases`, {
                        method: 'POST',
                        headers: {'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json'},
                        body: JSON.stringify({ caseType: 'VISA_PROCESSING' })
                    });
                    if (cr.ok) caseObj = await cr.json();
                }
                if (caseObj) state.caseId = caseObj.id;
            } catch (e) { console.error('ensureCaseCreated', e); }
        }

        async function uploadOnbDoc(type, event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!state.caseId) await ensureCaseCreated();
            if (!state.caseId) {
                alert('Could not create case for document upload');
                return;
            }
            
            const statusDiv = document.getElementById(`status-${type}`);
            statusDiv.innerText = 'Uploading...';
            statusDiv.style.color = 'var(--primary)';
            
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch(`${API}/documents/onboarding?type=${type}`, {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${state.token}`},
                    body: formData
                });
                if (res.ok) {
                    statusDiv.innerText = 'Upload successful!';
                } else {
                    statusDiv.innerText = 'Upload failed.';
                    statusDiv.style.color = '#f87171';
                }
            } catch { 
                statusDiv.innerText = 'Upload failed.';
                statusDiv.style.color = '#f87171';
            }
        }



        function setupSidebar() {
            const nav = document.getElementById('sidebar-nav');
            let links = '';
            if (state.user.role === 'MEMBER') {
                links = `
                    <div class="nav-item active" onclick="loadCases()" style="cursor:pointer"><i data-lucide="layout-dashboard"></i> Dashboard</div>
                    <div class="nav-item" onclick="selectCaseId(window.casesList?.[0]?.id)" style="cursor:pointer"><i data-lucide="folder"></i> Active Case</div>
                    <div class="nav-item" style="cursor:pointer"><i data-lucide="file-text"></i> Documents</div>
                `;
            } else if (state.user.role === 'LAWYER') {
                links = `
                    <div class="nav-item active" onclick="loadCases()" style="cursor:pointer"><i data-lucide="briefcase"></i> Caseload</div>
                    <div class="nav-item" style="cursor:pointer"><i data-lucide="calendar"></i> Appointments</div>
                    <div class="nav-item" style="cursor:pointer"><i data-lucide="scale"></i> Court Dates</div>
                `;
            } else {
                links = `
                    <div class="nav-item active" onclick="loadCases()" style="cursor:pointer"><i data-lucide="inbox"></i> Intake Queue</div>
                    <div class="nav-item" style="cursor:pointer"><i data-lucide="file-check"></i> Document Review</div>
                `;
            }
            nav.innerHTML = links;
            safeCreateIcons();
        }

        async function loadCases() {
            try {
                // Show dashboard, hide case
                document.getElementById('dashboard-view-container').style.display = 'block';
                document.getElementById('case-view-container').style.display = 'none';
                document.getElementById('right-panel-context').style.display = 'none';
                document.getElementById('main-app-layout').style.gridTemplateColumns = '260px 1fr';

                const res = await fetch(`${API}/cases`, {
                    headers: {'Authorization': `Bearer ${state.token}`},
                    cache: 'no-store'
                });
                if (!res.ok) { console.warn('loadCases: HTTP', res.status); return; }
                const cases = await res.json();
                const list = Array.isArray(cases) ? cases : (cases.data || []);
                
                // Build Dashboard Cards
                const grid = document.getElementById('dashboard-grid');
                if (state.user.role === 'MEMBER') {
                    grid.innerHTML = `
                        <div class="card glass-panel" style="padding: 1.5rem">
                            <h3 style="margin-bottom: 1rem; color: #818cf8"><i data-lucide="user"></i> Context</h3>
                            <p><strong>Name:</strong> ${state.user.name}</p>
                            <p><strong>Nationality:</strong> ${state.user.profile?.nationality || 'N/A'}</p>
                            <p><strong>Visa Type:</strong> ${state.user.profile?.visaType || 'N/A'}</p>
                        </div>
                        <div class="card glass-panel" style="padding: 1.5rem">
                            <h3 style="margin-bottom: 1rem; color: #818cf8"><i data-lucide="briefcase"></i> Legal Profile</h3>
                            <p><strong>Status:</strong> ${state.user.legalProfile?.currentVisaStatus || 'N/A'}</p>
                            <p><strong>Expiry:</strong> ${state.user.legalProfile?.visaExpiry ? new Date(state.user.legalProfile.visaExpiry).toLocaleDateString() : 'N/A'}</p>
                            <p><strong>Employer:</strong> ${state.user.legalProfile?.currentEmployer || 'N/A'}</p>
                        </div>
                        <div class="card glass-panel" style="padding: 1.5rem">
                            <h3 style="margin-bottom: 1rem; color: #818cf8"><i data-lucide="plane"></i> Travel Summary</h3>
                            <p><strong>Country of Residence:</strong> ${state.user.profile?.countryOfResidence || 'N/A'}</p>
                            <p><strong>Port of Entry:</strong> ${state.user.profile?.portOfEntry || 'N/A'}</p>
                        </div>
                        <div class="card glass-panel" style="padding: 1.5rem">
                            <h3 style="margin-bottom: 1rem; color: #818cf8"><i data-lucide="folder"></i> Case Summary</h3>
                            <p><strong>Active Cases:</strong> ${list.length}</p>
                            ${list.length > 0 ? `<button class="btn btn-secondary" style="margin-top:1rem" onclick="selectCaseId('${list[0].id}')">View Latest Case</button>` : '<p>No active cases.</p>'}
                        </div>
                    `;
                } else {
                    grid.innerHTML = `
                        <div class="card glass-panel" style="padding: 1.5rem">
                            <h3 style="margin-bottom: 1rem; color: #818cf8"><i data-lucide="briefcase"></i> Caseload</h3>
                            <p><strong>Active Cases:</strong> ${list.length}</p>
                        </div>
                    `;
                }
                safeCreateIcons();

                // Store list for selectCaseId
                window.casesList = list;
            } catch(e) {
                console.error('loadCases error:', e);
            }
        }

        async function selectCaseId(id) {
            const caseObj = window.casesList?.find(c => c.id === id);
            if (caseObj) await selectCase(caseObj);
        }

        async function startNewCase() {
            // Placeholder for Case Creation Wizard (Phase 5)
            // For now, we'll auto-create and select a new case to demonstrate the flow
            try {
                const createRes = await fetch(`${API}/cases`, {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json'},
                    body: JSON.stringify({ caseType: 'VISA_PROCESSING' }) // In Phase 5 this will be selectable
                });
                if (createRes.ok) {
                    const newCase = await createRes.json();
                    await selectCase(newCase);
                }
            } catch (e) {
                console.error('startNewCase error:', e);
            }
        }

        async function selectCase(caseObj) {
            try {
                state.caseId = caseObj.id;

                // Show Case View, hide dashboard
                document.getElementById('dashboard-view-container').style.display = 'none';
                document.getElementById('case-view-container').style.display = 'flex';
                document.getElementById('right-panel-context').style.display = 'flex';
                document.getElementById('main-app-layout').style.gridTemplateColumns = '260px 1fr 320px';

                // Header
                const headerCN = document.getElementById('header-case-number');
                const headerBadges = document.getElementById('header-badges');
                if (headerCN) headerCN.innerText = caseObj.caseNumber || 'N/A';
                if (headerBadges) headerBadges.innerHTML = `
                    <span class="badge primary">${(caseObj.caseType||'').replace(/_/g, ' ')}</span>
                    <span class="badge warning">${(caseObj.status||'').replace(/_/g, ' ')}</span>
                `;

                // Init Chat Session
                const sessRes = await fetch(`${API}/sessions`, {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json'},
                    body: JSON.stringify({ caseId: caseObj.id, sessionType: 'INTAKE' })
                });
                if (sessRes.ok) {
                    const session = await sessRes.json();
                    state.sessionId = session.id;
                    const chatContainer = document.getElementById('chat-messages');
                    if (chatContainer) {
                        chatContainer.innerHTML = '';
                        if (session.messages && Array.isArray(session.messages)) {
                            session.messages.forEach(m => {
                                if (m.role !== 'system') appendMessage(m.role, m.content, m.options);
                            });
                        }
                    }
                } else {
                    console.warn('Session creation failed:', sessRes.status);
                }

                // Load Timeline
                try {
                    const tlRes = await fetch(`${API}/timeline/${caseObj.id}`, {
                        headers: {'Authorization': `Bearer ${state.token}`}
                    });
                    if (tlRes.ok) {
                        const tlData = await tlRes.json();
                        renderTimeline(tlData.events || []);
                    }
                } catch(tlErr) {
                    console.warn('Timeline load failed:', tlErr);
                }

                safeCreateIcons();
            } catch(e) {
                console.error('selectCase error:', e);
            }
        }

        function renderTimeline(events) {
            const container = document.getElementById('timeline-list');
            container.innerHTML = events.map(e => `
                <div class="timeline-event">
                    <div class="event-icon"><i data-lucide="${getIconForEvent(e.eventType)}" style="width: 20px; color: var(--primary)"></i></div>
                    <div class="event-content">
                        <h4>${e.title}</h4>
                        <p>${e.description || ''}</p>
                        <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.5rem">
                            ${new Date(e.createdAt).toLocaleString()}
                        </div>
                    </div>
                </div>
            `).join('');
            safeCreateIcons();
        }

        function getIconForEvent(type) {
            if(type.includes('DOCUMENT')) return 'file';
            if(type.includes('LAWYER')) return 'briefcase';
            if(type.includes('APPOINTMENT') || type.includes('COURT')) return 'calendar';
            if(type.includes('STATUS')) return 'activity';
            return 'check-circle';
        }

        function appendMessage(role, text, options = []) {
            const container = document.getElementById('chat-messages');
            let optsHtml = '';
            
            if (options && options.length > 0) {
                optsHtml = `<div class="message-options">
                    ${options.map(o => `<button class="msg-opt-btn" onclick="sendOption('${o}')">${o}</button>`).join('')}
                </div>`;
            }

            // Simple markdown parser for bold and lists
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                                    .replace(/\n/g, '<br>');

            container.innerHTML += `
                <div class="message ${role === 'assistant' ? 'ai' : 'user'}">
                    ${formattedText}
                    ${optsHtml}
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendOption(text) {
            document.getElementById('chat-input').value = text;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !state.sessionId) return;
            
            input.value = '';
            appendMessage('user', text);

            const res = await fetch(`${API}/sessions/${state.sessionId}/message`, {
                method: 'POST',
                headers: {'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json'},
                body: JSON.stringify({ message: text })
            });
            
            const data = await res.json();
            
            // Parse structured JSON response from AI orchestrator
            let aiMsg = data.aiResponse.content;
            let options = [];
            
            try {
                const parsed = JSON.parse(aiMsg);
                aiMsg = parsed.message;
                options = parsed.options || [];
                
                // If AI decided to change state or create event based on intent
                if (parsed.timelineEvent) {
                    renderTimeline([{ 
                        ...parsed.timelineEvent, 
                        createdAt: new Date().toISOString(),
                        eventType: parsed.timelineEvent.type 
                    }]);
                }
            } catch(e) {
                // fallback if not JSON
            }

            appendMessage('assistant', aiMsg, options);
        }

        async function uploadDocument(e) {
            const file = e.target.files[0];
            if(!file || !state.caseId) return;

            appendMessage('user', `📎 Uploading document: ${file.name}...`);
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const res = await fetch(`${API}/documents/upload?caseId=${state.caseId}&type=OTHER`, {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${state.token}`},
                    body: formData
                });
                
                if (res.ok) {
                    appendMessage('assistant', `✅ Successfully received ${file.name}. It has been added to your case file.`);
                    // Reload timeline
                    loadCases(); 
                }
            } catch(err) {
                appendMessage('assistant', '❌ Upload failed. Please try again.');
            }
        }

        function initWebSocket() {
            if(window.socket) return;
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            window.socket = io(`${protocol}//${window.location.host}`);
            
            window.socket.on('connect', () => {
                if(state.caseId) window.socket.emit('join_room', `case:${state.caseId}`);
            });
            
            window.socket.on('timeline.updated', (payload) => {
                console.log('Realtime timeline update', payload);
                // In full implementation, incrementally update timeline UI
            });
        }
    </script>
